name: Benchmark Evaluation

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_eval:
    runs-on: macos-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        
      - name: Install Dependencies
        run: |
          echo "Dependencies loaded via macos-latest runner (cmake, make, python3 pre-installed)."
          echo "Further needs: gnu-sed and st"
          brew update
          brew install gnu-sed st

      - name: Cache synthcurves dataset
        uses: actions/cache@v4
        with:
          path: build/bin/synthcurves-multiview-3d-dataset
          key: synthcurves-dataset-v1

      - name: Cache benchmark history
        uses: actions/cache@v4
        with:
          path: |
            tests/benchmark/toplevel/history.json
            tests/benchmark/individual/*-benchmark/*-run
          key: benchmark-history-${{ github.sha }}
          restore-keys: |
            benchmark-history-

      - name: Build MINUS and Run Benchmarks
        run: |
          # Build out-of-source
          mkdir build && cd build
          cmake ..
          make -j4
          
          # Run the evaluation scripts
          make eval
          
      # Debug ------------------------------------------------------------------
#       - name: Setup Interactive SSH Debug Session
#         uses: mxschmitt/action-tmate@v3
#         Optional: Timeout the session after 15 minutes so it doesn't run forever
#         timeout-minutes: 15 
      - name: Setup Interactive SSH Debug Session
        uses: owenthereal/action-upterm@v1
        with:
          # Optional: limit access only to your GitHub user account
          limit-access-to-actor: true 
      # ------------------------------------------------------------------------

      - name: Prepare Pages Layout
        # The public directory was fully assembled during make eval by package_dashboard.py 
        # This step is just meant to output what was generated for verification.
        run: |
          ls -R public

          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
